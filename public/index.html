<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FairShift: Fair, Safe, Transparent Work</title>
  <meta name="description" content="FairShift gives workers transparent pay and a safe voice, and gives employers clear workforce insight.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <div>
      <h1>FairShift</h1>
      <p>Fair pay you can see. A voice you can trust. Safer work for everyone.</p>
    </div>
  </header>
  <main id="main-content">
    <section class="card" aria-labelledby="intro-heading">
      <h2 id="intro-heading">Choose who you are</h2>
      <p class="muted">Demo mode: pick a person to see their view. Workers see their own hours, pay and reports. Managers see their whole workforce.</p>
    </section>
    <div id="persona-list" class="persona-grid" aria-live="polite"></div>
    <p id="sign-in-error" class="error" role="alert" hidden></p>
  </main>
  <script type="module" src="/js/signIn.js"></script>
</body>
</html>
